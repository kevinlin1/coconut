name: Build, check accessibility, and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Matches `compiler` in typst.toml. Bundle export is experimental and its
  # behaviour may change between releases, so the toolchain is pinned rather
  # than tracking latest.
  TYPST_VERSION: "0.15.1"

jobs:
  accessibility:
    name: Build the bundle and check it
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: ${{ env.TYPST_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # The alt-text rules, tested against the descriptions they must reject and
      # the ones they must not. No browser and no build behind it, so a rule
      # broken in either direction fails here in seconds rather than after a
      # full build.
      - name: Test the alt-text rules
        run: npm test

      # Only the browser binaries are worth caching; `playwright install` still
      # runs afterwards to pull the system libraries it needs, which are not
      # part of this path.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      # Stages the working tree as @preview/coconut and builds every shape
      # of the example site from template/main.typ — the same entrypoint, with
      # the same pinned import, that `typst init @preview/coconut` gives a user.
      # The pin resolves to this branch rather than to Typst Universe, so what
      # CI checks is the source in the pull request.
      - name: Build the example site against the working tree
        run: .github/scripts/build.sh build

      # The reader is checked alongside the website because concatenating every
      # route into one document can produce problems no single page has, such as
      # duplicate landmark labels.
      - name: Check every page with axe
        run: |
          node .github/scripts/axe-check.mjs build/site build/reader \
            --report build/axe-report.json

      # axe checks that images have alt text. This checks that the alt text is a
      # description — not a filename, a placeholder, or the caption again — for
      # every image on the page, including any that reached it without going
      # through a component. Runs even when axe failed, so one build reports
      # everything that is wrong with it rather than one thing at a time.
      - name: Check that the alt text describes something
        if: always()
        run: |
          node .github/scripts/alt-text-check.mjs build/site build/reader \
            --report build/alt-text-report.json

      - name: Upload the built site and both reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-and-reports
          path: build/
          if-no-files-found: error

  publish:
    name: Publish the website to GitHub Pages
    # Only what the checks have already passed gets published, and only from
    # main — a pull request builds and is checked, but never deploys.
    needs: accessibility
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    # Pages accepts one deployment at a time. Queue rather than cancel, so a
    # merge is never dropped in favour of a newer commit that is still building.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      # For the assembly script only; the site itself comes from the artifact
      # the previous job checked, so the published bytes are the checked bytes
      # rather than a second build of the same commit.
      - uses: actions/checkout@v5

      - name: Download the checked site
        uses: actions/download-artifact@v4
        with:
          name: site-and-reports
          path: build

      - name: Assemble the Pages root
        run: .github/scripts/pages.sh build build/pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

      - id: deploy
        uses: actions/deploy-pages@v4
